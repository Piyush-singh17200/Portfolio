<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="DriveEasy case study cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080C0F"/>
      <stop offset="0.55" stop-color="#141009"/>
      <stop offset="1" stop-color="#1E160B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#E4C48E" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#E4C48E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B98A4A"/>
      <stop offset="1" stop-color="#E4C48E"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E4C48E" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
