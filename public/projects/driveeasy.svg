  <path d="M790 500 C 900 430, 1010 560, 1140 470" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="2"/>

  <text x="70" y="86" fill="#E4C48E" font-family="Consolas, monospace" font-size="17" letter-spacing="5">PIYUSH SINGH / CASE STUDY 01</text>
